<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabla de resultados - Natación</title>
  <link rel="stylesheet" href="./src/css/screen.css?v=3" />
  <link rel="stylesheet" href="./src/css/aero.css?v=2" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge" role="img" aria-label="Natación">
          <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <circle cx="23.5" cy="7" r="2" fill="currentColor" stroke="none"/>
            <path d="M8 12.5c2.3-2.8 5.3-3.1 8.3-.7l3.1 2.5 4.1-.8M10 12l-2.2 3.7 5.1 1.5 3.8-2.7M4 21c2.7-2 5.3-2 8 0s5.3 2 8 0 5.3-2 8 0M4 26c2.7-2 5.3-2 8 0s5.3 2 8 0 5.3-2 8 0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
          </svg>
        </div>
        <h1 class="brand-title">Control de natación</h1>
      </div>
      <nav class="screen-actions" aria-label="Sesión">
        <a class="admin-link" href="./admin.html">Administración</a>
        <button class="screen-signout" type="button" data-sign-out>Cerrar sesión</button>
      </nav>
    </header>
    <div id="screenConnection" class="connection-banner offline" role="status">Conectando con Firebase...</div>

    <section class="official-clock" aria-label="Cronómetro oficial">
      <div>
        <p class="head-label">Tiempo oficial</p>
        <div id="eventTime" class="event-time">00:00.00</div>
        <p id="eventRemaining" class="event-remaining">Restante: 30:00.00</p>
      </div>
      <div id="eventStatus" class="status-chip">Preparado</div>
    </section>

    <section class="table-panel">
      <div class="table-head">
        <div>
          <p class="head-label">Resultados</p>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Carril</th>
            <th>Equipo</th>
            <th>Juez</th>
            <th>Distancia</th>
            <th>Tiempo acumulado</th>
            <th>Vueltas</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="7" class="empty-state">Esperando información de los jueces...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>

  <script type="module" src="./src/js/screen.js?v=4"></script>
</body>
</html>
