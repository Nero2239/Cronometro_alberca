<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1724">
  <title>Acceso - Cronometraje de Natación</title>
  <link rel="stylesheet" href="./src/css/auth.css?v=2">
  <link rel="stylesheet" href="./src/css/aero.css?v=2">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="authTitle">
      <header class="auth-brand">
        <div class="auth-mark" role="img" aria-label="Natación">
          <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <circle cx="23.5" cy="7" r="2" fill="currentColor" stroke="none"/>
            <path d="M8 12.5c2.3-2.8 5.3-3.1 8.3-.7l3.1 2.5 4.1-.8M10 12l-2.2 3.7 5.1 1.5 3.8-2.7M4 21c2.7-2 5.3-2 8 0s5.3 2 8 0 5.3-2 8 0M4 26c2.7-2 5.3-2 8 0s5.3 2 8 0 5.3-2 8 0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
          </svg>
        </div>
        <p class="eyebrow">Cronometraje de natación</p>
        <h1 id="authTitle">Acceso a tu grupo</h1>
        <p class="auth-intro">Inicia sesión con la cuenta compartida de tu grupo de alberca.</p>
      </header>

      <div class="auth-tabs" role="tablist" aria-label="Acceso o registro">
        <button id="loginTab" class="auth-tab" type="button" role="tab" aria-selected="true">Iniciar sesión</button>
        <button id="registerTab" class="auth-tab" type="button" role="tab" aria-selected="false">Registrar grupo</button>
      </div>

      <label class="remember-choice">
        <input id="rememberMe" type="checkbox">
        <span>Recordar mi sesión y correo en este dispositivo</span>
      </label>

      <form id="loginForm" class="auth-form">
        <label for="loginEmail">Correo electrónico</label>
        <input id="loginEmail" name="email" type="email" autocomplete="username" required>
        <label for="loginPassword">Contraseña</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
        <button class="auth-submit" type="submit">Entrar</button>
      </form>

      <form id="registerForm" class="auth-form" hidden>
        <label for="organizationName">Nombre del grupo o institución</label>
        <input id="organizationName" name="organizationName" type="text" maxlength="120" autocomplete="organization" required>
        <label for="poolName">Nombre de la alberca</label>
        <input id="poolName" name="poolName" type="text" maxlength="120" required>
        <label for="contactName">Nombre del contacto</label>
        <input id="contactName" name="contactName" type="text" maxlength="120" autocomplete="name" required>
        <label for="contactPhone">Teléfono de contacto</label>
        <input id="contactPhone" name="phone" type="tel" maxlength="40" autocomplete="tel" required>
        <label for="organizationCity">Ciudad</label>
        <input id="organizationCity" name="city" type="text" maxlength="80" autocomplete="address-level2" required>
        <label for="registerEmail">Correo electrónico de acceso</label>
        <input id="registerEmail" name="email" type="email" maxlength="254" autocomplete="email" required>
        <label for="registerPassword">Contraseña</label>
        <input id="registerPassword" name="password" type="password" minlength="6" autocomplete="new-password" required>
        <label for="confirmPassword">Confirmar contraseña</label>
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
        <button class="auth-submit" type="submit">Crear cuenta del grupo</button>
      </form>
      <p id="authFeedback" class="auth-feedback" role="status" aria-live="polite"></p>
      <p class="auth-footnote">El correo es el usuario de acceso. La contraseña no se guarda en este dispositivo.</p>
    </section>
  </main>
  <script type="module">
    import { setupAuthPage } from './src/js/auth.js?v=3';
    setupAuthPage();
  </script>
</body>
</html>
